name: Surveillance Whop

on:
  schedule:
    # Toutes les 30 minutes. GitHub utilise l'heure UTC.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whop-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      CHECK_INTERVAL_MINUTES: "30"
      MIN_CPM: "0.80"
      MIN_TOTAL_BUDGET: "3000"
      MAX_USED_PERCENT: "30"
      PREFERRED_USED_PERCENT: "25"
      MAX_FAST_DEADLINE_HOURS: "3"
      SHOW_BROWSER: "false"

    steps:
      - name: Télécharger le bot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restaurer l'historique
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: whop-state-${{ github.run_id }}
          restore-keys: |
            whop-state-

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le secret Discord
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Le secret DISCORD_WEBHOOK_URL est absent."
            exit 1
          fi

      - name: Examiner Whop
        run: python bot.py --once
